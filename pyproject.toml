[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdlc-agents"
version = "0.1.0"
description = "SDLC Orchestrator–Worker agents with Strands, Ollama, and GEPA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "strands-agents[ollama]>=1.0.0",
    "gepa>=0.0.7",
    "litellm>=1.50.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
sdlc-agents = "sdlc_agents.cli:main"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_agents"]
